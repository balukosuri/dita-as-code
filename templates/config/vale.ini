# Prose linting for DITA topics.
#
# THREE HARD CONSTRAINTS, all of which cause confusing failures if ignored:
#
# 1. Vale supports .dita natively, but it works by shelling out to the `dita` command with
#    the html5 transform and linting the result. DITA-OT must be on PATH, which means Java
#    must be installed. No Java means no prose linting of DITA at all.
#
# 2. .ditamap is NOT a supported extension. Any prose held in a map - short descriptions,
#    navigation titles - is NOT covered by this file. Do not report coverage you do not have.
#
# 3. Never add a [formats] section mapping `dita`. It silently breaks native DITA handling.
#    Likewise, never add a bare [*.xml] section without a Transform, or Vale emits
#    "No XSLT transform provided!" for every stray XML file in the tree.
#
# Version floor: Vale 3.22.0. TokenIgnores and BlockIgnores only work on DITA from that
# version onward, so below it you cannot suppress a false positive.
#
# Performance: Vale invokes `dita` per run and its own documentation warns of worse
# performance on DITA than other formats. On several hundred topics this is slow enough to
# look like a hang. It is not.

StylesPath = styles
MinAlertLevel = suggestion

# Scoped to *.dita ONLY, deliberately. See constraints 2 and 3 above.
[*.dita]
BasedOnStyles = Vale

# Elements whose content is not prose and must not be spell-checked or style-checked.
# Vale already skips <code>-class elements by default; these are the DITA-specific ones.
TokenIgnores = (<codeph>[^<]*</codeph>), \
               (<filepath>[^<]*</filepath>), \
               (<userinput>[^<]*</userinput>), \
               (<systemoutput>[^<]*</systemoutput>), \
               (<apiname>[^<]*</apiname>), \
               (<parmname>[^<]*</parmname>), \
               (<varname>[^<]*</varname>)

BlockIgnores = (?s)(<codeblock.*?</codeblock>), \
               (?s)(<pre.*?</pre>), \
               (?s)(<screen.*?</screen>)
